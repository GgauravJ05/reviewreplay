name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run the tests
        run: python -m pytest -q
      - name: Check the CLI starts
        run: reviewreplay --help

  action-dry-run:
    name: action (dry run, no secret)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rr
        uses: ./
        with:
          cases: cases/real
          subjects: baseline,code-review-skill-invoked
          dry-run: "true"
          comment: "false"
      - name: The scorecard says it was a dry run
        env:
          SCORECARD: ${{ steps.rr.outputs.scorecard }}
        run: |
          grep -q "Dry run: nothing was reviewed" "$SCORECARD"
